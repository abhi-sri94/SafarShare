<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafarShare - Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0F5C3A;
      --primary-dark: #083d26;
      --bg: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
      --error: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #e6f4ee, transparent),
                  radial-gradient(circle at bottom left, #f1f5f9, transparent);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
                  0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    .header { text-align: center; margin-bottom: 32px; }
    .logo { 
      font-size: 2rem; font-weight: 800; color: var(--primary); 
      margin-bottom: 8px; display: block;
    }
    .header p { color: var(--muted); font-size: 0.95rem; }

    .form-group { margin-bottom: 20px; }
    .label { 
      display: block; font-size: 0.85rem; font-weight: 600; 
      margin-bottom: 8px; color: var(--text);
    }
    .input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid #e2e8f0; background: white;
      font-family: inherit; font-size: 1rem; transition: all 0.2s;
    }
    .input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(15, 92, 58, 0.1);
    }

    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--primary); color: white; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
      margin-top: 8px;
    }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.loading { opacity: 0.7; pointer-events: none; }

    .error-msg {
      padding: 12px; border-radius: 8px; background: #fef2f2;
      color: var(--error); font-size: 0.85rem; margin-bottom: 24px;
      display: none; border: 1px solid #fee2e2;
    }

    .footer-links {
       margin-top: 24px; text-align: center; font-size: 0.85rem; color: var(--muted);
    }
    .footer-links a { color: var(--primary); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header">
      <span class="logo">Safar Admin</span>
      <p>Secure Dashboard Personnel Only</p>
    </div>

    <div id="error-box" class="error-msg">Invalid email or password.</div>

    <form id="login-form">
      <div class="form-group">
        <label class="label">Email Address</label>
        <input type="email" id="email" class="input" placeholder="admin@safarshare.com" required>
      </div>

      <div class="form-group">
        <label class="label">Secret Password</label>
        <input type="password" id="password" class="input" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submit-btn" class="btn">Access Dashboard</button>
    </form>

    <div class="footer-links">
      <p>SafarShare Platform Operations</p>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5001/api';

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-box');
      
      btn.classList.add('loading');
      btn.innerText = 'Verifying...';
      err.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      console.log('📡 Attempting login for:', email);

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: email, password })
        });

        const data = await res.json();
        console.log('📡 DEBUG LOGIN DATA:', data);
        
        if (data.success && data.data && data.data.user) {
          const userRole = (data.data.user.role || '').toLowerCase().trim();
          
          if (userRole === 'admin') {
            localStorage.setItem('safarshare_admin_token', data.token);
            window.location.href = 'safarshare-admin.html';
          } else {
            throw new Error(`Access Denied: Your account role is "${userRole}". Only administrators can access this panel.`);
          }
        } else {
          throw new Error(data.message || 'Login failed. Please check your credentials.');
        }
      } catch (e) {
        console.error('❌ Login Error:', e);
        err.innerText = e.message;
        err.style.display = 'block';
        btn.classList.remove('loading');
        btn.innerText = 'Access Dashboard';
      }
    };
  </script>
</body>
</html>
