services:
  # ── 1. Backend API ────────────────────────────────────────────────────────
  - type: web
    name: safarshare-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: true
      - key: JWT_REFRESH_SECRET
        sync: true
      - key: SUPABASE_URL
        sync: true
      - key: SUPABASE_ANON_KEY
        sync: true
      - key: ADMIN_SECRET_KEY
        sync: true
      - key: GOOGLE_MAPS_API_KEY
        sync: true
      - key: RAZORPAY_KEY_ID
        sync: true
      - key: RAZORPAY_KEY_SECRET
        sync: true
      - key: FIREBASE_PROJECT_ID
        sync: true
      - key: FIREBASE_PRIVATE_KEY
        sync: true
      - key: FIREBASE_CLIENT_ID
        sync: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: true
      - key: CLOUDINARY_API_KEY
        sync: true
      - key: CLOUDINARY_API_SECRET
        sync: true

  # ── 2. Static Website ─────────────────────────────────────────────────────
  - type: web
    name: safarshare-web
    env: static
    publishDir: .
    routes:
      - type: rewrite
        source: /app/*
        destination: /apps/safarshare-app-connected.html
      - type: rewrite
        source: /admin/*
        destination: /apps/admin-login.html
    envVars:
      - key: SKIP_INSTALL
        value: true
